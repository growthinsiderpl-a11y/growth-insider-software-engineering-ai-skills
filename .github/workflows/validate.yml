name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Validate repository contract
        run: python scripts/validate_repository.py
      - name: Validate behavioral fixtures
        run: python scripts/validate_behavioral_evals.py
      - name: Run unit and tool tests
        run: python -m pytest tests/ -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Compile Python
        run: python -m compileall -q scripts tests
